---
- hosts: all
  become: yes

  tasks:
    - name: Update Packages
      apt:
        update_cache: yes
      when: ansible_distribution == "Ubuntu"  ## condition 
    
- hosts: dev
  become: true
  
  tasks: 
     - name: Install apache in Ubuntu Server
       tags: apache
       apt:
         name: apache2
         state: latest
       when: ansible_distribution == "Ubuntu"

     - name:  copy default file html file for site
       tags: apache,apache2,httpd
       copy:
         src: default_site.html
         dest: /var/www/html/index.html
         owner: root
         group: root
         mode: 0644
 
